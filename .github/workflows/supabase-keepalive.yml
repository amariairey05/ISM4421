# Free Supabase projects pause after about a week without activity, which
# makes login fail with "Can't reach the login server". This pings the
# database every three days so the project stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive() database function
        env:
          # Public by design; the same key ships in public/js/config.js.
          SUPABASE_URL: https://aiitajwhzjcjlckgazhq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_TB5EJwpBf2zliu4LPHpsCw_1G7zVf9F
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
